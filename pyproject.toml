[tool.uv.sources]
bricklayer-sdk = { workspace = true }
brickwright = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests/", "skill/tests/"]
addopts = "--import-mode=importlib"
markers = [
    "integration: drives the CLI or a real subprocess",
]
filterwarnings = [
    "ignore::DeprecationWarning:pygfx",
]
